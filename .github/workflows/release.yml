name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build .app bundle and DMG
        env:
          PACKAGE_DMG: '1'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          APP_VERSION="${VERSION}" ./scripts/build-app.sh release

      - name: Verify native binary privacy and signature
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify_native_privacy.py dist/ZTERouterBar.app/Contents/MacOS/ZTERouterBar
          codesign --verify --deep --strict dist/ZTERouterBar.app

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTERouterBar-macos
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 platforms;android-36 build-tools;37.0.0'

      - name: Run Python verification tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.ZTEROUTERBAR_ANDROID_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.ZTEROUTERBAR_ANDROID_SIGNING }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PROPERTIES"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > /tmp/zterouterbar-android-release.p12
          printf '%s' "$SIGNING_PROPERTIES" > /tmp/zterouterbar-android-release.properties
          echo 'ZTEROUTERBAR_ANDROID_SIGNING_PROPERTIES=/tmp/zterouterbar-android-release.properties' >> "$GITHUB_ENV"

      - name: Run JUnit tests and build ARM64 APK
        working-directory: android
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          ./gradlew testDebugUnitTest --no-daemon -PappVersion="${VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ./gradlew assembleDebug --no-daemon -PappVersion="${VERSION}"
          else
            ./gradlew assembleRelease --no-daemon -PappVersion="${VERSION}"
          fi

      - name: Verify and package ARM64 APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          mkdir -p artifacts
          APK=$(find android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$APK"
          python3 scripts/verify_android.py "$APK"
          cp "$APK" "artifacts/ZTERouterBar_${VERSION}_arm64-v8a.apk"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTERouterBar-android-arm64
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f -- /tmp/zterouterbar-android-release.p12 /tmp/zterouterbar-android-release.properties

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ZTERouterBar-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.dmg *.apk > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --verify-tag \
            --title "ZTERouterBar ${GITHUB_REF_NAME#v}" \
            --generate-notes
