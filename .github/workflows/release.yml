name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build .app bundle and DMG
        env:
          PACKAGE_DMG: '1'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          APP_VERSION="${VERSION}" ./scripts/build-app.sh release

      - name: Verify native binary privacy
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify_native_privacy.py dist/ZTERouterBar.app/Contents/MacOS/ZTERouterBar

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZTERouterBar-macos
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZTERouterBar-macos
          path: artifacts

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.dmg > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --verify-tag \
            --title "ZTERouterBar ${GITHUB_REF_NAME#v}" \
            --generate-notes
